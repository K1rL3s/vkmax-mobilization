name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check submission freeze
        run: |
          if [ "$(date +%s)" -ge "$(date -d "$FREEZE_AT" +%s)" ]; then
            echo "::error::Деплой заморожен с $FREEZE_AT: на проверке должна работать сданная версия"
            exit 1
          fi
        env:
          FREEZE_AT: 2026-09-30T12:00:00+03:00

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "root@$VPS_HOST"
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: 194.169.160.229

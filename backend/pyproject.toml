[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["graphify-out"]

[project]
name = "zheka"
version = "0.1.0"
description = "Трек «Умный город» в хакатоне по чат-ботам или мини-приложениям для мессенджера MAX"
readme = "README.md"
authors = [
    { name = "Kirill Lesovoi", email = "kirill.lesovoi@mail.ru" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "maxo[dishka,fastapi,magic-filter,redis]==0.9.0",
    "adaptix==3.0.0b12",
    "environs==15.2.0",
    "dishka==1.10.1",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "gunicorn==26.2.0",
    "sqlalchemy[asyncio]==2.0.53",
    "psycopg[binary]==3.3.5",
    "greenlet==3.5.6",
    "alembic==1.20.0",
    "alembic-postgresql-enum==1.10.0",
    "taskiq==0.12.6",
    "taskiq-redis==1.2.3",
    "redis==8.1.0",
    "python-multipart==0.0.31",
    "aiohttp==3.14.3",
]

[dependency-groups]
fast = [
    "gunicorn-h1c==0.6.9",
    "uvloop==0.22.1",
]
dev = [
    "ruff==0.16.7",
    "black==26.5.1",
    "codespell==2.4.3",
    "bandit==1.9.4",
    "slotscheck==0.21.0",
    "mypy==2.3.1",
    "bump2version==1.0.1",
    "pyyaml==6.0.3",
]
tests = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.15.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = [
    "zheka",
    "migrations",
    "tests",
]
strict = true
strict_bytes = true
local_partial_types = true
ignore_missing_imports = true
warn_unreachable = true
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "mutable-override",
    "unimported-reveal",
    "deprecated",
]

[tool.ruff]
src = [
    "zheka",
    "migrations",
    "tests",
]
fix = true
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "FBT",
    "A001",
    "A002",
    "A003",
    "A006",
    "CPY001",
    "EM",
    "FIX",
    "FA",
    "ICN",
    "LOG014",
    "TD001",
    "TD002",
    "TD003",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TC007",
    "C901",
    "PERF203",
    "DOC",
    "D",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0916",
    "PLR0917",
    "PLR1702",
    "PLR6301",
    "RUF001",
    "RUF002",
    "RUF003",
    "TRY003",
    "TRY300",
    "N818",
    "S311",
    "UP046",
    "DTZ007",
    "FAST003",
]

[tool.ruff.lint.isort]
known-local-folder = ["zheka"]
case-sensitive = true
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "A005"]
"migrations/**/*.py" = ["ARG001", "E501", "INP001", "N999"]
"scripts/*.py" = ["INP001"]
"zheka/bot/middlewares/*.py" = ["ARG002"]
"zheka/broker/middlewares.py" = ["ARG002"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = 'zheka/.*\.py$|migrations/.*\.py$|tests/.*\.py$'

[tool.codespell]
ignore-words-list = "dependant,selectin,ba,asend"

[tool.bandit]
skips = ["B311"]

[tool.slotscheck]
strict-imports = true
exclude-modules = "^zheka\\.api\\.asgi$"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
core = "sysmon"

components:
  schemas:
    AccessRequestGrid:
      properties:
        access_request:
          $ref: '#/components/schemas/AccessRequestItem'
        targets:
          items:
            $ref: '#/components/schemas/AccessTargetCell'
          type: array
          title: Targets
        flats_without_residents:
          items:
            type: integer
          type: array
          title: Flats Without Residents
          description: 'Квартиры, которым не досталось ячейки: в них некому ответить - подтвержденного жителя нет вовсе или он заблокирован УК. Заполняется только при создании запроса'
          default: []
      type: object
      required:
      - access_request
      - targets
      title: AccessRequestGrid
    AccessRequestItem:
      properties:
        id:
          type: integer
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        house_id:
          type: integer
          title: House Id
        address:
          type: string
          title: Address
        reason:
          type: string
          title: Reason
        date:
          type: string
          format: date
          title: Date
        slots:
          items:
            $ref: '#/components/schemas/AccessSlotItem'
          type: array
          title: Slots
        responded_count:
          type: integer
          title: Responded Count
        targets_count:
          type: integer
          title: Targets Count
        my_flat_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: My Flat Id
        my_slot_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: My Slot Id
      type: object
      required:
      - id
      - created_at
      - house_id
      - address
      - reason
      - date
      - slots
      - responded_count
      - targets_count
      title: AccessRequestItem
    AccessSlotInput:
      properties:
        starts_at:
          type: string
          format: date-time
          title: Starts At
        capacity:
          type: integer
          title: Capacity
          description: Сколько квартир помещается в окно
      type: object
      required:
      - starts_at
      - capacity
      title: AccessSlotInput
    AccessSlotItem:
      properties:
        id:
          type: integer
          title: Id
        starts_at:
          type: string
          format: date-time
          title: Starts At
        capacity:
          type: integer
          title: Capacity
          description: Сколько квартир помещается в окно
        taken:
          type: integer
          title: Taken
          description: Сколько квартир уже выбрали это окно
      type: object
      required:
      - id
      - starts_at
      - capacity
      - taken
      title: AccessSlotItem
    AccessTargetCell:
      properties:
        flat_id:
          type: integer
          title: Flat Id
        flat_number:
          type: string
          title: Flat Number
        slot_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Slot Id
        responded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Responded At
      type: object
      required:
      - flat_id
      - flat_number
      title: AccessTargetCell
    AddMeterRequest:
      properties:
        type:
          $ref: '#/components/schemas/MeterType'
        tariff_zones:
          type: integer
          title: Tariff Zones
        serial:
          type: string
          title: Serial
        next_verification_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Next Verification Date
      type: object
      required:
      - type
      - tariff_zones
      - serial
      title: AddMeterRequest
    AdminHouseCard:
      properties:
        id:
          type: integer
          title: Id
        address:
          type: string
          title: Address
        region:
          type: string
          title: Region
        city:
          type: string
          title: City
        street:
          type: string
          title: Street
        building:
          type: string
          title: Building
        cadastral_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Cadastral No
        entrances:
          type: integer
          title: Entrances
        flats_count:
          type: integer
          title: Flats Count
        residents_count:
          type: integer
          title: Residents Count
        verified_residents_count:
          type: integer
          title: Verified Residents Count
        pending_verifications:
          type: integer
          title: Pending Verifications
        open_requests:
          type: integer
          title: Open Requests
        chat_bound:
          type: boolean
          title: Chat Bound
        chat_binding_code:
          type: string
          title: Chat Binding Code
        entrance_qrs:
          items:
            $ref: '#/components/schemas/EntranceQr'
          type: array
          title: Entrance Qrs
        object_qrs:
          items:
            $ref: '#/components/schemas/ObjectQr'
          type: array
          title: Object Qrs
          description: 'QR на объектах подъезда: лифт, свет, уборка'
        built_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Built Year
        floors:
          anyOf:
          - type: integer
          - type: 'null'
          title: Floors
        area:
          anyOf:
          - type: integer
          - type: 'null'
          title: Area
          description: Площадь в сотых долях квадратного метра
        chairman_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Chairman Name
        chat_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Chat Title
      type: object
      required:
      - id
      - address
      - region
      - city
      - street
      - building
      - cadastral_no
      - entrances
      - flats_count
      - residents_count
      - verified_residents_count
      - pending_verifications
      - open_requests
      - chat_bound
      - chat_binding_code
      - entrance_qrs
      - object_qrs
      title: AdminHouseCard
    AdminHouseListItem:
      properties:
        id:
          type: integer
          title: Id
        address:
          type: string
          title: Address
        entrances:
          type: integer
          title: Entrances
        flats_count:

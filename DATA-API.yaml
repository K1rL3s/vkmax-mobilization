schemaVersion: "1.0"

solution:
  name: Жэка Коммуналкин
  teamId: Мобилизация

api:
  baseUrl: https://vkmax.k1rles.ru
  openapi: openapi.yaml

checks:
  - id: provision_consent
    name: Согласие на обработку персональных данных
    description: >-
      Согласие на обработку персональных данных, без него API не пускает дальше.
      Роли resident и staff - одна учетная запись «Проверяющий API» с тестовым токеном
      в заголовке Authorization, он указан в каждой такой проверке.
      resident - житель демо-УК №5 с подтвержденной квартирой, начислениями и показаниями за полгода.
      staff - сотрудник демо-УК №5, видит заявки домов своей организации.
      Мини-приложение вместо токена передает подписанную initData из MAX в заголовке WebAppData
    method: POST
    path: /api/me/consent
    role: resident
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
        Content-Type: application/json
      body:
        version: "1.2"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [user_id, name, consent_at, consent_version, residencies, orgs, is_demo]
    repeatable: true

  - id: provision_demo
    name: Демо-доступ проверяющего
    description: Демо-доступ - своя квартира в первом доме демо-УК №5 и роль сотрудника этой УК. Ссылки со служебного слайда ведут в демо-УК №1, поэтому заявки проверки не пересекаются с заявками жюри
    method: POST
    path: /api/demo/activate
    role: resident
    dependsOn: [provision_consent]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
        Content-Type: application/json
      body:
        number: 5
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [org, residency]
      bodySchema:
        type: object
        properties:
          org: {type: object, required: [org_id, name, role, is_demo]}
          residency: {type: object, required: [resident_id, house_id, address]}
    repeatable: true

  - id: healthcheck
    name: Доступность сервиса
    description: Сервис и база доступны
    method: GET
    path: /api/healthcheck
    role: public
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [ok]
    repeatable: true

  - id: profile
    name: Профиль проверяющего
    description: Профиль проверяющего - дома, квартиры и роли в организациях
    method: GET
    path: /api/me
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [user_id, name, consent_at, consent_version, residencies, orgs, is_demo]
    repeatable: true

  - id: profile_unauthorized
    name: Запрос без токена
    description: Без токена API отказывает
    method: GET
    path: /api/me
    role: public
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [status, trace_id, error]
      bodySchema:
        type: object
        properties:
          error: {type: object, required: [title, detail]}
    repeatable: true

  - id: request_categories
    name: Категории заявок
    description: Категории заявок и срок выполнения каждой
    method: GET
    path: /api/request-categories
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
    expected:
      statusCodes: [200]
      contentType: application/json
      bodySchema:
        type: array
        items: {type: object, required: [category, label, zone, deadline_text]}
    repeatable: true

  - id: house_search
    name: Поиск дома по адресу
    description: Поиск дома по адресу в справочнике
    method: GET
    path: /api/houses
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
      query:
        q: Ленинский проспект
        limit: 20
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, total]
      bodySchema:
        type: object
        properties:
          items:
            type: array
            items: {type: object, required: [id, address, city, street, building, is_connected]}
    repeatable: true

  - id: house_card
    name: Карточка дома
    description: Карточка дома - УК, тарифы, капремонт, документы
    method: GET
    path: /api/houses/{house_id}
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
      path:
        house_id: 6
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, address, region, city, street, building, cadastral_no, entrances, is_connected, demand_count, demand_sent, documents]
    repeatable: true

  - id: request_create
    name: Подача заявки
    description: Житель подает заявку о протечке в квартире и сразу получает номер и срок
    method: POST
    path: /api/requests
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
        Content-Type: application/json
        X-House-Id: "6"
      body:
        category: leak
        description: Течет кран в ванной, проверка API
        place: flat
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, created_at, category, category_label, description, status, channel, has_photos, group_size, house_id, address, org_name, deadline_text, photos, result_photos, messages, timeline, can_review, can_rate, place]
    repeatable: false

  - id: request_list
    name: Список заявок жителя
    description: Список заявок жителя со статусами
    method: GET
    path: /api/requests
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
        X-House-Id: "6"
      query:
        limit: 20
        offset: 0
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, total]
      bodySchema:
        type: object
        properties:
          items:
            type: array
            items: {type: object, required: [id, created_at, category, status, group_size, place]}
    repeatable: true

  - id: request_card
    name: Карточка своей заявки
    description: Карточка своей заявки - статус, срок, история
    method: GET
    path: /api/requests/{request_id}
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
      path:
        request_id: 766
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, created_at, category, status, house_id, address, deadline_text, timeline, messages, place]
    repeatable: true

  - id: request_card_foreign
    name: Чужая заявка
    description: Чужая заявка недоступна - данные изолированы по жителю и организации
    method: GET
    path: /api/requests/{request_id}
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
      path:
        request_id: 1
    expected:
      statusCodes: [404]
      contentType: application/json
      requiredFields: [status, trace_id, error]
      bodySchema:
        type: object
        properties:
          error: {type: object, required: [title, detail]}
    repeatable: true

  - id: meters
    name: Счетчики квартиры
    description: Счетчики квартиры жителя и возможность передать показание
    method: GET
    path: /api/flats/{flat_id}/meters
    role: resident
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
      path:
        flat_id: 1121
    expected:
      statusCodes: [200]
      contentType: application/json
      bodySchema:
        type: array
        items: {type: object, required: [id, flat_id, type, tariff_zones, serial, can_submit, verification_expired]}
    repeatable: true

  - id: staff_requests
    name: Входящие заявки УК
    description: Входящие заявки домов организации сотрудника
    method: GET
    path: /api/admin/requests
    role: staff
    dependsOn: [provision_demo]
    request:
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
      query:
        limit: 20
        offset: 0
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, total]
      bodySchema:
        type: object
        properties:
          items:
            type: array
            items: {type: object, required: [id, status, house_id, address, is_staff_author, place]}
    repeatable: true

  - id: staff_reply
    name: Ответ сотрудника жителю
    description: Сотрудник отвечает жителю, ответ уходит жителю сообщением бота
    method: POST
    path: /api/admin/requests/{request_id}/reply
    role: staff
    dependsOn: [provision_demo]
    request:
      path:
        request_id: 766
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
        Content-Type: application/json
      body:
        text: Приняли, мастер придет сегодня
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, status, messages, timeline, is_staff_author]
    repeatable: false

  - id: staff_status
    name: Принятие заявки в работу
    description: >-
      Сотрудник принимает заявку в работу. Повторный вызов с тем же статусом
      ничего не меняет и отвечает той же карточкой
    method: POST
    path: /api/admin/requests/{request_id}/status
    role: staff
    dependsOn: [provision_demo]
    request:
      path:
        request_id: 766
      headers:
        Authorization: Bearer 34c63235dea4b1fb95ce89a9f108fc18
        Content-Type: application/json
      body:
        status: accepted
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, status, timeline]
    repeatable: true

proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s;
    set $api api:7001;
    set $web web:80;
    set $ofm tiles.openfreemap.org;
    set $osm tile.openstreetmap.org;
    set $topo a.tile.opentopomap.org;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://$web;
    }

    location /api/ {
        client_max_body_size 15m;

        proxy_pass http://$api;
    }

    location = /api/ {
        return 302 /api/docs;
    }

    location = /api {
        return 302 /api/docs;
    }

    location /files/ {
        proxy_pass http://$api;
    }

    location /tiles/ofm/ {
        rewrite ^/tiles/ofm/(.*)$ /$1? break;
        proxy_pass https://$ofm;
        proxy_set_header Host $ofm;
        proxy_set_header User-Agent "zheka-kommunalkin/1.0 (+https://vkmax.k1rles.ru)";
        proxy_set_header Accept-Encoding gzip;
        proxy_pass_request_headers off;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_cache tiles;
        proxy_cache_key $proxy_host$uri;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        gunzip on;
        add_header X-Cache $upstream_cache_status;
    }

    location /tiles/osm/ {
        rewrite ^/tiles/osm/(.*)$ /$1? break;
        proxy_pass https://$osm;
        proxy_set_header Host $osm;
        proxy_set_header User-Agent "zheka-kommunalkin/1.0 (+https://vkmax.k1rles.ru)";
        proxy_set_header Accept-Encoding gzip;
        proxy_pass_request_headers off;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_cache tiles;
        proxy_cache_key $proxy_host$uri;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        gunzip on;
        add_header X-Cache $upstream_cache_status;
    }

    location /tiles/topo/ {
        rewrite ^/tiles/topo/(.*)$ /$1? break;
        proxy_pass https://$topo;
        proxy_set_header Host $topo;
        proxy_set_header User-Agent "zheka-kommunalkin/1.0 (+https://vkmax.k1rles.ru)";
        proxy_set_header Accept-Encoding gzip;
        proxy_pass_request_headers off;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_cache tiles;
        proxy_cache_key $proxy_host$uri;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        gunzip on;
        add_header X-Cache $upstream_cache_status;
    }

    location = /webhook {
        proxy_connect_timeout 10s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;

        proxy_pass http://$api;
    }
}

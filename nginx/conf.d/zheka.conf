# Пока только HTTP - задача на TLS добавит сюда второй `server`-блок на 443,
# а не перепишет этот.
server {
    listen 80;
    server_name _;

    # Встроенный DNS докера, переразрешается на каждый запрос, чтобы рестарт
    # `api` или `web` (у обоих `restart: unless-stopped`) не оставлял nginx
    # привязанным к мёртвому IP контейнера до собственного рестарта nginx.
    resolver 127.0.0.11 valid=10s;
    set $api api:7001;
    set $web web:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Статика живёт в образе `web` (frontend/Dockerfile), там же её SPA-фолбэк
    # и кеш-заголовки на /assets/ - здесь только проксирование, без root.
    location / {
        proxy_pass http://$web;
    }

    location /api/ {
        # python-multipart выкладывает всё тело на диск до того, как
        # FilesService успеет его отклонить (FILES_MAX_SIZE_MB=10 по
        # умолчанию), так что реальный потолок для диска - здесь, и он
        # должен быть больше FILES_MAX_SIZE_MB, а не равен ему.
        client_max_body_size 15m;

        proxy_pass http://$api;
    }

    location /files/ {
        proxy_pass http://$api;
    }

    location = /webhook {
        # MAX даёт боту 30 секунд на ответ - потолок nginx должен быть выше.
        proxy_connect_timeout 10s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;

        proxy_pass http://$api;
    }
}
